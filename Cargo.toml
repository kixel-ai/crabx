[package]
name = "crabx"
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
description = "Run a Rust CLI from its author's release, without compiling"
repository = "https://github.com/kixel-ai/crabx"
homepage = "https://crabx.kixel.me"
license = "GPL-3.0-only"
# The npm packages, installers, pipeline, and quests ship from the repository, not inside the
# crate; the pipeline README is the caller a test checks `crabx init` writes.
include = ["/LICENSE", "/README.md", "/pipeline/README.md", "/src", "/tests", "/vendor"]

[workspace]

[dependencies]
async-trait = "0.1.92"
binstalk-bins = "0.8.0"
binstalk-downloader = { version = "0.14.2", default-features = false, features = ["static", "rustls", "zlib-rs"] }
binstalk-git-repo-api = "0.5.54"
binstalk-types = "0.11.0"
bzip2 = "0.6.1"
bytes = "1.12.1"
compact_str = "0.10.0"
# Already in the tree through binstalk-registry; crabx reads crates.io's manifests itself to bound them.
cargo_toml = "1.0.1"
either = "1.19.0"
# The decoders binstalk-downloader extracts with, already in the tree, so crabx can unpack within budgets.
flate2 = { version = "1.1.11", default-features = false }
itertools = "0.15.0"
leon = "3.0.3"
leon-macros = "1.0.4"
liblzma = "0.4.9"
miette = "7.6.0"
minisign-verify = "0.3.0"
percent-encoding = "2.3.2"
rc-zip-sync = "4.4.2"
sha2 = "0.11.1"
strum = "0.28.0"
tar = { package = "binstall-tar", version = "0.4.42" }
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"
zstd = { version = "0.14.4", default-features = false }
anyhow = "1.0.104"
binstalk = { version = "0.31.0", default-features = false, features = ["rustls", "static", "zlib-rs"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0.0"
# Already in the tree through binstalk-registry, with the same features.
jiff = { version = "1.0.2", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snap = "1.1.2"
sigstore-verify = { version = "0.16.0", features = ["tuf"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[profile.release]
strip = true
# Whole-program optimization: a smaller download for every user, paid in build time by each
# release build and by `cargo install`.
lto = "fat"
codegen-units = 1
