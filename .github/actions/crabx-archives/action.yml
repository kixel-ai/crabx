name: Crabx archives
description: Download, verify, and stage in archives/ each target archive this run built for one crate release.

inputs:
  item:
    description: The crate release, as the pipeline's JSON
    required: true
  token:
    description: Reads this public repository's run artifacts and jobs, which needs no actions permission
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: inventory
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ITEM: ${{ inputs.item }}
      run: python3 "$GITHUB_ACTION_PATH/../../../pipeline/pipeline.py" inventory
    # One step per target, each into its own directory: download-artifact puts a lone
    # artifact straight into its path, and skip-decompress keeps every ZIP unextracted
    # until the next step checks it.
    - if: steps.inventory.outputs.x86_64-unknown-linux-gnu
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.inventory.outputs.x86_64-unknown-linux-gnu }}
        path: ${{ runner.temp }}/crabx/x86_64-unknown-linux-gnu
        skip-decompress: true
    - if: steps.inventory.outputs.aarch64-unknown-linux-gnu
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.inventory.outputs.aarch64-unknown-linux-gnu }}
        path: ${{ runner.temp }}/crabx/aarch64-unknown-linux-gnu
        skip-decompress: true
    - if: steps.inventory.outputs.x86_64-apple-darwin
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.inventory.outputs.x86_64-apple-darwin }}
        path: ${{ runner.temp }}/crabx/x86_64-apple-darwin
        skip-decompress: true
    - if: steps.inventory.outputs.aarch64-apple-darwin
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.inventory.outputs.aarch64-apple-darwin }}
        path: ${{ runner.temp }}/crabx/aarch64-apple-darwin
        skip-decompress: true
    - if: steps.inventory.outputs.x86_64-pc-windows-msvc
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.inventory.outputs.x86_64-pc-windows-msvc }}
        path: ${{ runner.temp }}/crabx/x86_64-pc-windows-msvc
        skip-decompress: true
    - if: steps.inventory.outputs.aarch64-pc-windows-msvc
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.inventory.outputs.aarch64-pc-windows-msvc }}
        path: ${{ runner.temp }}/crabx/aarch64-pc-windows-msvc
        skip-decompress: true
    - shell: bash
      env:
        ITEM: ${{ inputs.item }}
      run: python3 "$GITHUB_ACTION_PATH/../../../pipeline/pipeline.py" collect
