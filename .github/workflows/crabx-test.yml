name: Crabx fixture

# Builds and attests the two-binary fixture on every target through the real pipeline, without
# tags or releases, and runs the dry run consumers gate their releases on. Dispatch it on a
# branch when a pipeline change needs the real targets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/crabx.yml
  dry-run:
    uses: ./.github/workflows/crabx-dry-run.yml
