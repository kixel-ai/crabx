name: End to end

# The live checks the merge gate can't run: crabx's release build of this commit against the
# real crates.io, GitHub, and Sigstore on every target, its tests and Windows installer
# off Linux, and the site and installers Pages serves at crabx.kixel.me. Nightly, outside the gate; a pull request that changes this check runs it too.
on:
  schedule:
    # After release.yml's nightly run, so a new release is checked the same morning.
    - cron: '17 9 * * *'
  pull_request:
    paths:
      - .github/workflows/e2e.yml
      - .github/workflows/crabx-build.yml
      - pipeline/**
      - tests/e2e.sh
      - tests/install.sh
      - tests/install-redirect.ps1
      - release.py
      - install.ps1
      - install.sh
      - npm/**
      - src/launcher.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: python3 release.py nightly

  # The pipeline's build, as a release ships it.
  build:
    needs: plan
    uses: ./.github/workflows/crabx-build.yml
    with:
      builds: ${{ needs.plan.outputs.builds }}

  e2e:
    needs: [plan, build]
    # One target's failed build leaves the others' archives to check.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    # The pipeline cross-builds Intel macOS on Arm; run it on Intel rather than Rosetta.
    runs-on: ${{ matrix.target == 'x86_64-apple-darwin' && 'macos-15-intel' || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: crabx-${{ matrix.target }}-v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabx-crabx@${{ needs.plan.outputs.version }}@${{ matrix.target }}
          path: archives
      - run: tar -xzf "archives/$ARCHIVE.tgz" -C archives
      - name: Live crates
        env:
          # Read-only; crabx uses it for GitHub's API, as users in CI do, instead of the
          # unauthenticated quota a shared runner address spends.
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: tests/e2e.sh "archives/$ARCHIVE/crabx$EXE" "$TARGET"

  # The npm packages release.py would publish for this build, not the registry's.
  pack:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crabx-crabx@${{ needs.plan.outputs.version }}@*
          merge-multiple: true
          path: archives
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 release.py pack "$VERSION" archives packages
          mkdir tarballs
          for package in packages/@kixel/*; do npm pack "./$package" --pack-destination tarballs; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: tarballs/*.tgz
          if-no-files-found: error

  # `npx @kixel/crabx install`, then a crate's launcher, run from a new shell on every OS.
  install:
    needs: [plan, pack]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: tarballs
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        # Without optional dependencies, npm can't swap in the registry's platform package. npm
        # reads a relative `tarballs/x.tgz` as a GitHub repository, so pass native absolute paths.
        run: |
          platform=$(node -p "require('./npm/crabx.js').packageName(process.platform, process.arch).replace('@', '').replace('/', '-')")
          tarballs=$(node -p "require('path').resolve('tarballs')")
          tests/install.sh fnox@1.50.0 --omit=optional "$tarballs/kixel-crabx-$VERSION.tgz" "$tarballs/$platform-$VERSION.tgz"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs rust-toolchain.toml's pinned toolchain on first use.
      # Nextest bounds a hung test; `cargo test` waits forever.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: nextest
      - run: cargo nextest run --locked

  # The documented `curl.exe | iex`, run on this checkout's installer. It downloads the published
  # release, so it needs no build and runs whatever the e2e legs do.
  install-ps1:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: powershell
        run: |
          $env:CRABX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'crabx-bin'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $env:CRABX_INSTALL_DIR) { throw 'install.ps1 left its directory off the user Path' }
          & (Join-Path $env:CRABX_INSTALL_DIR 'crabx.exe') --version
      # A named crate through both forms, which pass it as an argument and in CRABX_INSTALL, and
      # a spec that is an option, which must install nothing.
      - name: Crates
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:CRABX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'crabx-crates'
          & ([scriptblock]::Create((Get-Content -Raw install.ps1))) fnox@1.50.0
          if ((& (Join-Path $env:CRABX_INSTALL_DIR 'fnox.exe') --version) -ne 'fnox 1.50.0') { throw 'install.ps1 did not install the crate it was given' }
          Remove-Item (Join-Path $env:CRABX_INSTALL_DIR 'fnox.exe')
          $env:CRABX_INSTALL = 'fnox@1.50.0'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ((& (Join-Path $env:CRABX_INSTALL_DIR 'fnox.exe') --version) -ne 'fnox 1.50.0') { throw 'install.ps1 did not install CRABX_INSTALL' }
          # Launcher records are per user, so the deployed installer below can't install fnox into another directory while this one exists.
          Remove-Item (Join-Path $env:CRABX_INSTALL_DIR 'fnox.exe')
          $env:CRABX_INSTALL = '--build'
          try { Get-Content -Raw install.ps1 | Invoke-Expression } catch { if ("$_" -notmatch "invalid crate '--build'") { throw }; return }
          throw 'install.ps1 accepted an option as a crate'
      # Windows PowerShell 5.1 follows an HTTPS-to-HTTP redirect unless told not to.
      - name: Redirects
        shell: powershell
        run: ./tests/install-redirect.ps1
      - name: Deployed installer
        if: ${{ github.event_name != 'pull_request' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:CRABX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'crabx-live'
          powershell -ExecutionPolicy Bypass -c "curl.exe --proto '=https' --tlsv1.2 -fsSL https://crabx.kixel.me/install.ps1 | Out-String | iex"
          if ($LASTEXITCODE) { throw "install.ps1 from crabx.kixel.me failed: $LASTEXITCODE" }
          & (Join-Path $env:CRABX_INSTALL_DIR 'crabx.exe') --version
          powershell -ExecutionPolicy Bypass -c "& ([scriptblock]::Create((curl.exe --proto '=https' --tlsv1.2 -fsSL https://crabx.kixel.me/install.ps1 | Out-String))) fnox@1.50.0"
          if ($LASTEXITCODE) { throw "install.ps1 from crabx.kixel.me failed to install a crate: $LASTEXITCODE" }
          if ((& (Join-Path $env:CRABX_INSTALL_DIR 'fnox.exe') --version) -ne 'fnox 1.50.0') { throw 'install.ps1 from crabx.kixel.me did not install the crate it was given' }

  # This checkout's install.sh, which downloads the published release, so it needs no build: a
  # named crate through both forms, and a spec that is an option, which must install nothing.
  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export CRABX_INSTALL_DIR="$RUNNER_TEMP/crabx-crates"
          sh install.sh fnox@1.50.0
          [ "$("$CRABX_INSTALL_DIR/fnox" --version)" = 'fnox 1.50.0' ]
          rm "$CRABX_INSTALL_DIR/fnox"
          CRABX_INSTALL=fnox@1.50.0 sh install.sh
          [ "$("$CRABX_INSTALL_DIR/fnox" --version)" = 'fnox 1.50.0' ]
          CRABX_INSTALL=--build sh install.sh 2>refused && exit 1
          grep -q "invalid crate '--build'" refused

  # The documented `curl | sh`, from crabx.kixel.me, and the page there. Not on pull requests,
  # whose installers aren't deployed; install-ps1 runs the documented `curl.exe | iex` the same way.
  site:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export CRABX_INSTALL_DIR="$RUNNER_TEMP/crabx-bin"
          curl --proto '=https' --tlsv1.2 -fsSL https://crabx.kixel.me/install.sh | sh
          "$CRABX_INSTALL_DIR/crabx" --version
          curl --proto '=https' --tlsv1.2 -fsSL https://crabx.kixel.me/install.sh | sh -s -- fnox@1.50.0
          [ "$("$CRABX_INSTALL_DIR/fnox" --version)" = 'fnox 1.50.0' ]
          curl --proto '=https' --tlsv1.2 -fsS https://crabx.kixel.me/ -o index.html
          grep -qF '<title>crabx' index.html
