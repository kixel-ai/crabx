name: End to end

# The live checks the merge gate can't run: crabx's release build of this commit against the
# real crates.io, GitHub, and Sigstore on every target, its tests and Windows installer
# off Linux, and the site and installers Pages serves at crabx.kixel.me. Nightly, outside the gate; a pull request that changes this check runs it too.
on:
  schedule:
    # After release.yml's nightly run, so a new release is checked the same morning.
    - cron: '17 9 * * *'
  pull_request:
    paths:
      - .github/workflows/e2e.yml
      - .github/workflows/crabx-build.yml
      - pipeline/**
      - tests/e2e.sh
      - release.py
      - install.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: python3 release.py nightly

  # The pipeline's build, as a release ships it.
  build:
    needs: plan
    uses: ./.github/workflows/crabx-build.yml
    with:
      builds: ${{ needs.plan.outputs.builds }}

  e2e:
    needs: [plan, build]
    # One target's failed build leaves the others' archives to check.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    # The pipeline cross-builds Intel macOS on Arm; run it on Intel rather than Rosetta.
    runs-on: ${{ matrix.target == 'x86_64-apple-darwin' && 'macos-15-intel' || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: crabx-${{ matrix.target }}-v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabx-crabx@${{ needs.plan.outputs.version }}@${{ matrix.target }}
          path: archives
      - run: tar -xzf "archives/$ARCHIVE.tgz" -C archives
      - name: Live crates
        env:
          # Read-only; crabx uses it for GitHub's API, as users in CI do, instead of the
          # unauthenticated quota a shared runner address spends.
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: tests/e2e.sh "archives/$ARCHIVE/crabx$EXE" "$TARGET"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs rust-toolchain.toml's pinned toolchain on first use.
      - run: cargo test --locked

  # The documented `irm | iex`, run on this checkout's installer. It downloads the published
  # release, so it needs no build and runs whatever the e2e legs do.
  install-ps1:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: powershell
        run: |
          $env:CRABX_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'crabx-bin'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $env:CRABX_INSTALL_DIR) { throw 'install.ps1 left its directory off the user Path' }
          & (Join-Path $env:CRABX_INSTALL_DIR 'crabx.exe') --version

  # The documented installer URLs and the page, as Pages serves them from site.yml's last deploy.
  # Not on pull requests, whose installers aren't deployed.
  site:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      # The commit Pages serves, so an installer change landing around this run can't race it.
      - id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow site.yml --branch main --status success -L 1 --json headSha -q '.[0].headSha')
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "no successful site.yml deploy on main" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.sha }}
          persist-credentials: false
      # The query string skips Pages' 10-minute cache of an older deploy.
      - run: |
          for file in install.sh install.ps1; do
            curl -fsSL --proto '=https' "https://crabx.kixel.me/$file?run=$GITHUB_RUN_ID" -o "deployed-$file"
            cmp "deployed-$file" "$file"
          done
          curl -fsSL --proto '=https' "https://crabx.kixel.me/?run=$GITHUB_RUN_ID" -o deployed-index.html
          grep -q '<title>crabx' deployed-index.html
