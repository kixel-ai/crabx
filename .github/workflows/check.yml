name: Check

# `just ci` after each push to main, coalesced; pull requests run it locally before pushing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      # Dependencies are nearly all of clippy's and the tests' compile time. Only main
      # saves, so a manual run on another branch can't write what later runs build on.
      # The manifest is in the key because a feature or profile edit rebuilds dependencies
      # without touching the lockfile.
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cargo-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
      - run: nix develop --command just ci
        env:
          # A fresh checkout rebuilds crabx itself whole, so incremental state is only cache weight.
          CARGO_INCREMENTAL: 0
      - if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The same paths, or the save writes a cache no restore matches.
          path: *cargo-paths
          key: ${{ steps.cargo.outputs.cache-primary-key }}
